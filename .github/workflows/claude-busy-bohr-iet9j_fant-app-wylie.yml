# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fant-app-wylie

on:
  push:
    branches:
      - claude/busy-bohr-IeT9J
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Assemble standalone bundle
        run: |
          # Static assets and public files go inside the standalone tree.
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # Force-include Prisma's generated client + native engine.
          mkdir -p .next/standalone/node_modules/.prisma
          cp -r node_modules/.prisma/. .next/standalone/node_modules/.prisma/
          # npm start -> the standalone server.js. Next.js 15 already binds
          # to 0.0.0.0 by default; don't set HOSTNAME so NextAuth never
          # picks it up as a canonical host.
          node -e "const fs=require('fs');const p=require('./.next/standalone/package.json');p.scripts=Object.assign(p.scripts||{},{start:'node server.js'});fs.writeFileSync('./.next/standalone/package.json',JSON.stringify(p,null,2));"

      - name: Zip standalone bundle
        run: cd .next/standalone && zip -r ../../release.zip .

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fant-app-wylie'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5E8A8F276AC04913ABC3C1478829C455 }}
